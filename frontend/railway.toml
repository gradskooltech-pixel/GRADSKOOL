# GRADSKOOL — Railway Deployment Configuration (Frontend)
#
# This is a SEPARATE Railway service from the backend (backend/railway.toml).
# Both live in the same GitHub repo (monorepo) — Root Directory for this
# service must be set to `frontend` so Railway only builds this folder.
#
# Builds via the explicit frontend/Dockerfile (not Nixpacks auto-detection —
# see the Dockerfile's header comment for why that was switched, 2026-08-15).
#
# Setup:
#   1. In Railway, click + New → GitHub Repo → select this repo
#   2. Set Root Directory: frontend
#   3. Add env vars below in the Railway dashboard (Variables tab) — for
#      NEXT_PUBLIC_ vars specifically, they must ALSO be added as build args
#      if a new one is introduced (see ARG lines in Dockerfile)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start -- -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── ENVIRONMENT VARIABLES (set in Railway dashboard) ─────────────────────────
# NEXT_PUBLIC_ vars are baked in at BUILD time, not runtime — if you change
# one, you must redeploy (a restart alone won't pick up the new value).
# Declared as build ARGs in frontend/Dockerfile:
#
#   NEXT_PUBLIC_API_URL          → backend's Railway public URL + /api/v1
#   NEXT_PUBLIC_MAIN_DOMAIN      → https://gradskool.in
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID → same Client ID as backend (public, safe to expose)
#   NEXT_PUBLIC_GA_ID            → GA4 measurement ID (G-NJ36GFWSP3)
#   NODE_ENV=production
#
# NOT set — features not currently active (their code paths default safely
# to blank/off when unset): NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_BUNNY_LIBRARY_ID,
# NEXT_PUBLIC_ZOOM_SDK_KEY, NEXT_PUBLIC_EXAM, NEXT_PUBLIC_SUBDOMAIN. If any of
# these get turned on later, add its ARG/ENV pair back in frontend/Dockerfile
# first, or it'll silently stay blank regardless of what's set here.