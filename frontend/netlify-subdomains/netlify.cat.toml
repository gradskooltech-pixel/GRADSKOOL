# GRADSKOOL — cat.gradskool.in
# CAT hub — CATalysis, CAThlete, LRDI Hub, VARC Hub, CAT Mocks, CAT Books

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NEXT_PUBLIC_SUBDOMAIN = "cat"
  NEXT_PUBLIC_API_URL   = "https://api.gradskool.in"
  NEXT_PUBLIC_MAIN_URL  = "https://gradskool.in"
  NODE_VERSION          = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
