# GRADSKOOL — mhcet.gradskool.in
# Deploy this config when setting up the MHCET subdomain on Netlify.
# Set NEXT_PUBLIC_EXAM = mhcet in Netlify environment variables for this site.

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NEXT_PUBLIC_EXAM      = "mhcet"
  NEXT_PUBLIC_API_URL   = "https://api.gradskool.in"
  NEXT_PUBLIC_MAIN_URL  = "https://gradskool.in"
  NODE_VERSION          = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# / → /courses/mhcet
[[redirects]]
  from   = "/"
  to     = "/courses/mhcet"
  status = 302
  force  = false
