# GRADSKOOL — nmat.gradskool.in
# Deploy this config when setting up the NMAT subdomain on Netlify.
# Set NEXT_PUBLIC_EXAM = nmat in Netlify environment variables for this site.

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NEXT_PUBLIC_EXAM      = "nmat"
  NEXT_PUBLIC_API_URL   = "https://api.gradskool.in"
  NEXT_PUBLIC_MAIN_URL  = "https://gradskool.in"
  NODE_VERSION          = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# / → /courses/nmat
[[redirects]]
  from   = "/"
  to     = "/courses/nmat"
  status = 302
  force  = false
