# GRADSKOOL — gradskool.in
# Main marketing site — no NEXT_PUBLIC_EXAM set

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NEXT_PUBLIC_API_URL   = "https://api.gradskool.in"
  NEXT_PUBLIC_MAIN_URL  = "https://gradskool.in"
  NODE_VERSION          = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to apex
[[redirects]]
  from   = "https://www.gradskool.in/*"
  to     = "https://gradskool.in/:splat"
  status = 301
  force  = true
