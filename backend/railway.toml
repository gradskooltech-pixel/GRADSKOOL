# GRADSKOOL — Railway Deployment Configuration
#
# Deploy THREE separate Railway services from this monorepo:
#
#   Service 1: web    → Django API server (gunicorn)
#   Service 2: worker → Celery async task worker
#   Service 3: beat   → Celery Beat scheduler (cron-like)
#
# Each service uses the same repo + same env vars.
# Set RAILWAY_SERVICE_NAME to distinguish them in logs.
#
# Setup:
#   1. railway link             (link repo to Railway project)
#   2. railway up               (deploy web service)
#   3. Create worker service:   use Start Command below
#   4. Create beat service:     use Start Command below
#   5. Add all env vars from .env.example to Railway dashboard

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -"
healthcheckPath = "/api/v1/courses/homepage/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── WORKER SERVICE START COMMAND ──────────────────────────────────────────────
# celery -A config.celery worker --loglevel=info -Q default,high_priority --concurrency 2

# ── BEAT SERVICE START COMMAND ────────────────────────────────────────────────
# celery -A config.celery beat --loglevel=info

# ── ENVIRONMENT VARIABLES (set in Railway dashboard) ─────────────────────────
# See .env.example for full list.
# Critical ones:
#   SECRET_KEY
#   DATABASE_URL          (Supabase → copy from Supabase dashboard)
#   DJANGO_SETTINGS_MODULE=config.settings.production
#   ALLOWED_HOSTS         (comma-separated: api.gradskool.in,*.railway.app)
#   CORS_ALLOWED_ORIGINS  (https://gradskool.in,https://www.gradskool.in)
#   RESEND_API_KEY
#   RAZORPAY_KEY_ID
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
#   BUNNY_LIBRARY_ID
#   BUNNY_TOKEN_KEY
#   UPSTASH_REDIS_URL
#   SENTRY_DSN
#   OPENAI_API_KEY
#   INTERAKT_API_KEY
