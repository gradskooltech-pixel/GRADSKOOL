# GRADSKOOL — Railway Deployment Configuration
#
# Deploy THREE separate Railway services from this monorepo:
#
#   Service 1: web    → Django API server (gunicorn)
#   Service 2: worker → Celery async task worker
#   Service 3: beat   → Celery Beat scheduler (cron-like)
#
# Each service uses the same repo + same env vars.
#
# 2026-08-27: startCommand now points at start.sh, a dispatcher script that
# reads GRADSKOOL_ROLE and runs the correct real process (gunicorn,
# celery worker, or celery beat). This ONE startCommand is what every
# service actually runs — see start.sh's own comment for the full reason
# this indirection is needed (short version: Railway's dashboard Start
# Command field is locked by this file for every service, and new services
# can no longer opt into per-service Config as Code as of 2026-08-28, so
# there's no other way to give different services different commands from
# one railway.toml).
#
# CRITICAL SETUP STEP for worker/beat services: each one needs
# GRADSKOOL_ROLE set correctly in ITS OWN Variables tab (worker or
# beat — matching one of start.sh's case branches). Railway may already
# set this automatically to match the service's dashboard name — verify it
# actually does; if it doesn't match, the service silently falls through
# to running as web instead.
#
# Setup:
#   1. railway link             (link repo to Railway project)
#   2. railway up               (deploy web service)
#   3. Create worker service:   set GRADSKOOL_ROLE=worker in its Variables
#   4. Create beat service:     set GRADSKOOL_ROLE=beat in its Variables
#   5. Add all env vars from .env.example to Railway dashboard (all three services)

[build]
builder = "NIXPACKS"
# migrate was REMOVED from here on purpose (2026-09-04): this buildCommand is
# shared by all three services (web/worker/beat). Running `migrate` in all
# three builds means they can race against each other on the same Supabase
# DB when a new migration creates a table for the first time — two builds'
# CREATE TABLE statements collide with a
# "duplicate key value violates unique constraint pg_type_typname_nsp_index"
# error. Migrate now runs exactly once, from start.sh, only on the web
# service. Do not add migrate back here.
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "bash start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# healthcheckPath deliberately removed from here — it was shared across
# ALL THREE services via this one file, but only the web service actually
# serves HTTP. A Celery worker/beat process has nothing to respond to an
# HTTP healthcheck at all, so this would have made the worker/beat
# services fail their deploy healthcheck forever (confirmed as a real,
# common Railway failure pattern for non-HTTP services). Set
# healthcheckPath = /api/v1/courses/homepage/ directly in the WEB
# service's own dashboard settings instead (Settings → Deploy →
# Healthcheck Path) — that field should still be dashboard-editable even
# though Start Command isn't, since only Start Command was confirmed
# locked by this file. Leave it blank/unset on worker and beat.

# ── ENVIRONMENT VARIABLES (set in Railway dashboard) ─────────────────────────
# See .env.example for full list.
# Critical ones:
#   SECRET_KEY
#   DATABASE_URL          (Supabase → copy from Supabase dashboard)
#   DJANGO_SETTINGS_MODULE=config.settings.production
#   ALLOWED_HOSTS         (comma-separated: api.gradskool.in,*.railway.app)
#   CORS_ALLOWED_ORIGINS  (https://gradskool.in,https://www.gradskool.in)
#   RESEND_API_KEY
#   RAZORPAY_KEY_ID
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
#   BUNNY_LIBRARY_ID
#   BUNNY_TOKEN_KEY
#   UPSTASH_REDIS_URL
#   SENTRY_DSN
#   OPENAI_API_KEY
#   INTERAKT_API_KEY
#   GRADSKOOL_ROLE  (worker/beat services only — see start.sh)